[project]
name = "gemma-sae-hackathon"
version = "0.1.0"
description = "Gemma 3 and Gemma Scope 2 contrastive steering experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1,<2",
    "absl-py>=2,<3",
    "immutabledict>=4,<5",
    "langdetect==1.0.9",
    "nltk>=3.9.1,<4",
    "datasets>=3,<5",
    "fastapi>=0.115,<1",
    "gradio>=6,<7",
    "huggingface-hub>=0.34,<1",
    "pillow>=11,<13",
    "portalocker>=3,<4",
    "sae-lens>=6.30,<7",
    "safetensors>=0.4.3,<1",
    "sentencepiece>=0.2,<0.3",
    "torch>=2.6,<2.7",
    "torchvision>=0.21,<0.22",
    "transformers>=4.51.3,<5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.uv]
package = false
required-version = ">=0.9.15"

# The Linux x86_64 server's driver supports CUDA 12.4. Keep both PyTorch
# packages on that runtime; macOS continues to use the native PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]



[tool.ruff.lint.per-file-ignores]
"research/benchmarks/vendor/**/*.py" = ["E", "F"]
