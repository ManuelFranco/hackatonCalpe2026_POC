[project]
name = "gemma-sae-hackathon"
version = "0.1.0"
description = "Gemma 3 and Gemma Scope 2 contrastive steering experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1,<2",
    "gradio>=6,<7",
    "huggingface-hub>=0.34,<1",
    "pillow>=11,<13",
    "sae-lens>=6.30,<7",
    "safetensors>=0.4.3,<1",
    "sentencepiece>=0.2,<0.3",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.51.3,<5",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.uv]
package = false
required-version = ">=0.9.15"

# The Linux x86_64 server's driver supports CUDA 12.4. Keep both PyTorch
# packages on that runtime; macOS continues to use the native PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
